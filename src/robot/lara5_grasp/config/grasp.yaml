hand_grasp:
  ros__parameters:
    # Radians: thumb yaw, index, middle, ring, pinky, thumb pitch.
    close_positions: [1.1, 1.3, 1.3, 1.3, 1.3, 0.5]
    # First oppose the thumb, then close all still-free digits in small steps.
    thumb_opposition: 0.8
    max_joint_step: 0.05
    max_joint_speed: 0.20
    max_joint_acceleration: 0.50
    min_segment_duration: 0.25
    # One-time bounded preload, increased for the 0.15 kg cylinder's test lift.
    contact_preload: 0.04
    # After bilateral contact, one finite simulation-only flexion ramp. The
    # larger position error supplies holding torque with the existing kp=2.
    # No repeated squeeze or physical attachment; thumb yaw is unchanged.
    hold_preload: 0.25
    hold_preload_duration: 3.0
    contact_threshold_n: 0.15
    max_contact_force_n: 16.0
    # This names a simulation fixture, not a perception label or selected object.
    target_object_name: green_cylinder
    feedback_mode: simulation
    feedback_max_age: 0.5
    open_start_tolerance: 0.08
    joint_tolerance: 0.04
    tracking_tolerance: 0.08
    arm_stationary_tolerance: 0.01
    arm_stationary_window: 0.20
    verification_timeout: 1.0
    goal_response_timeout: 5.0
    segment_timeout_margin: 2.0
    closure_timeout: 60.0
    cancel_timeout: 5.0
